name: CI

# One verified build, deployed as-is:
#   verify      typecheck, tests, the Cloudflare Pages build and its checks → `pages` artifact
#   preview     pull requests from this repository → a Pages preview deployment per branch
#   production  pushes to main → the production Pages deployment
#
# Deploying needs two repository secrets: CLOUDFLARE_API_TOKEN (permission
# "Account · Cloudflare Pages · Edit") and CLOUDFLARE_ACCOUNT_ID. See the README.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its superseded run; every main commit runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PAGES_PROJECT: duel-of-factions
  PAGES_OUTPUT: dist/analog/public

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      wrangler-version: ${{ steps.wrangler.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Angular app, Strata server code, tests)
        run: npm run typecheck

      - name: Unit tests (engine, game store, API)
        run: npm test

      # Analog builds the client and Nitro's `cloudflare-pages` worker (SSR for /codex, /api).
      - name: Build for Cloudflare Pages
        run: npm run build:cloudflare

      - name: Check the Pages output
        run: |
          test -f "$PAGES_OUTPUT/_worker.js/index.js" || { echo "::error::missing _worker.js"; exit 1; }
          test -f "$PAGES_OUTPUT/_routes.json" || { echo "::error::missing _routes.json"; exit 1; }
          # Strata's server-only contract, double-checked on the artifact that ships: the codex
          # repository must never reach the browser assets.
          if grep -rl "CodexRepository" "$PAGES_OUTPUT/assets"; then
            echo "::error::server-only code found in browser assets"
            exit 1
          fi

      # The deploy jobs install exactly the Wrangler version pinned in package.json.
      - name: Read the pinned Wrangler version
        id: wrangler
        run: echo "version=$(node -p 'require("./package.json").devDependencies.wrangler')" >> "$GITHUB_OUTPUT"

      - name: Upload the Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: pages
          path: ${{ env.PAGES_OUTPUT }}
          if-no-files-found: error
          retention-days: 7

  preview:
    name: Deploy preview
    needs: verify
    # Forks get no secrets: their pull requests are verified but not deployed.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      # wrangler.jsonc (output dir, compatibility date and flags) is the source of truth.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: pages
          path: ${{ env.PAGES_OUTPUT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs the Wrangler pinned in package-lock.json, which the deploy steps below use.
      - name: Install dependencies
        run: npm ci

      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_VERSION: ${{ needs.verify.outputs.wrangler-version }}
        run: bash .github/scripts/ensure-pages-project.sh

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ needs.verify.outputs.wrangler-version }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy
            --branch=${{ github.head_ref }}
            --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: printf '### Preview deployed\n%s\n' "$URL" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy production
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two merges can reach this job together: deploy them one after the other and never cancel an
    # upload that has started. GitHub keeps only the newest pending run, so the newest commit wins.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://duel-of-factions.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: pages
          path: ${{ env.PAGES_OUTPUT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs the Wrangler pinned in package-lock.json, which the deploy steps below use.
      - name: Install dependencies
        run: npm ci

      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_VERSION: ${{ needs.verify.outputs.wrangler-version }}
        run: bash .github/scripts/ensure-pages-project.sh

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ needs.verify.outputs.wrangler-version }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy --branch=main --commit-hash=${{ github.sha }}

      # Fail the run if the deployment does not actually serve the game, the codex and the API.
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          for path in / /codex /api/health; do
            # A new deployment's TLS certificate can take a minute or two to be served (curl exit 35).
            status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 20 --retry-delay 6 --retry-all-errors "$URL$path")"
            echo "$path -> $status"
            test "$status" = 200
          done
